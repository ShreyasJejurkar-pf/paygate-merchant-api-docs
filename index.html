<title>Paygate Merchant API</title>
<style>
  /* Single light look, matching the PayFuture Connect API reference. */
  :root {
    --brand-bg: #00242e;
    --brand-border: #00181f;
    --brand-fg: #ffffff;
    --brand-muted: rgba(255, 255, 255, 0.72);
    --page-bg: #ffffff;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--page-bg);
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--brand-bg);
  }
  #brand {
    display: flex;
    align-items: center;
    gap: 24px;
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
    height: 56px;
    flex: 0 0 auto;
    background: var(--brand-bg);
    color: var(--brand-fg);
    border-bottom: 1px solid var(--brand-border);
    font: 500 14px/1 system-ui, -apple-system, sans-serif;
  }
  #brand .logo { display: flex; align-items: center; flex-shrink: 0; color: var(--brand-fg); }
  #brand .logo svg { display: block; width: 110px; height: auto; }
  #brand .title { white-space: nowrap; color: var(--brand-muted); }
  #brand .draft {
    margin-left: auto;
    padding: 4px 10px;
    border: 1px solid var(--brand-muted);
    border-radius: 999px;
    color: var(--brand-muted);
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  #app { flex: 1 1 auto; min-height: 0; }
  @media (max-width: 640px) {
    #brand {
      gap: 12px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      height: 52px;
      font-size: 13px;
    }
    #brand .logo svg { width: 88px; }
    #brand .title { display: none; }
  }
</style>
